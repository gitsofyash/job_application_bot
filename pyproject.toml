[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-bot"
version = "0.1.0"
description = "CLI assistant for extracting job descriptions and generating tailored application artifacts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-openai>=0.0.1",
    "langchain-anthropic>=0.0.1",
    "langchain-cohere>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-ollama>=0.1.0",
    "cohere>=5.0.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.2",
    "httpx>=0.25.0",
    "feedparser>=6.0.11",
    "aiofiles>=23.2.0",
    "async-timeout>=4.0.3",
]

[project.scripts]
job-application-bot = "job_application_bot.cli:run"

[tool.setuptools.packages.find]
include = ["job_application_bot*", "config*", "modules*", "utils*"]
