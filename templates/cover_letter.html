<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Cover Letter</title>
    <style>
        /* STRICT ONE-PAGE COVER LETTER TEMPLATE
         * ATS-friendly with guaranteed single page output
         * Simple formatting for maximum compatibility
         */
        
        @page {
            size: Letter;
            margin: 0.75in;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Calibri, Arial, Helvetica, sans-serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        
        .container {
            width: 7in;
            max-height: 10in;
            margin: 0 auto;
            padding: 0.75in;
            overflow: hidden;
        }
        
        /* DATE */
        .date {
            text-align: right;
            margin-bottom: 15px;
            font-size: 11pt;
            line-height: 1.4;
        }
        
        /* PARAGRAPHS */
        p {
            margin: 10px 0;
            text-align: left;
            line-height: 1.5;
            font-size: 11pt;
        }
        
        /* GREETING */
        .greeting {
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        /* OPENING PARAGRAPH */
        .opening {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        /* BODY PARAGRAPHS */
        .body {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        /* CLOSING PARAGRAPH */
        .closing-paragraph {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        /* SIGNATURE */
        .signature {
            margin-top: 15px;
            font-size: 11pt;
            line-height: 1.4;
        }

        @media print {
            body {
                padding: 0;
                margin: 0;
            }
            
            .container {
                padding: 0.75in;
                max-height: 10in;
                overflow: hidden;
                page-break-after: avoid;
            }

            p {
                page-break-inside: avoid;
            }
        }

        @media screen {
            .container {
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- DATE -->
        <div class="date">{{ date }}</div>
        
        <!-- GREETING -->
        <p class="greeting">{{ greeting }}</p>
        
        <!-- OPENING PARAGRAPH -->
        <p class="opening">{{ opening_paragraph }}</p>
        
        <!-- BODY PARAGRAPH 1 -->
        <p class="body">{{ body_paragraph_1 }}</p>
        
        <!-- BODY PARAGRAPH 2 -->
        <p class="body">{{ body_paragraph_2 }}</p>
        
        <!-- CLOSING PARAGRAPH -->
        <p class="closing-paragraph">{{ closing_paragraph }}</p>
        
        <!-- SIGNATURE -->
        <div class="signature">{{ signature }}</div>
    </div>
</body>
</html>
